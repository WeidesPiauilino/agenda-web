<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Web Sincronizada</title>
<!--
  AGENDA PESSOAL COM FIREBASE + GITHUB PAGES
  --------------------------------------------------
  1. Insira suas credenciais do Firebase no objeto 'firebaseConfig' abaixo.
  2. Ative o Firestore Database e o Authentication (Google ou E-mail) no console do Firebase.
  3. Envie este arquivo como 'index.html' para o seu repositório no GitHub.
-->
<style>
:root{--bg:#eef1f4;--sf:#fff;--tx:#14202b;--mut:#5d6b78;--ln:#d5dce2;--ac:#0e7c86;--ok:#2e8b57;--bad:#c4402f}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--bg:#10161c;--sf:#18212a;--tx:#e6edf2;--mut:#93a1ad;--ln:#2a3641;--ac:#4cc3cc;--ok:#52b788;--bad:#ef7a68}}
:root[data-tema="escuro"]{--bg:#10161c;--sf:#18212a;--tx:#e6edf2;--mut:#93a1ad;--ln:#2a3641;--ac:#4cc3cc;--ok:#52b788;--bad:#ef7a68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 4px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font:600 1.7rem Georgia,"Times New Roman",serif}
.user-bar{display:flex;align-items:center;gap:10px;font-size:.85rem}
.user-bar img{width:28px;height:28px;border-radius:50%}
main{flex:1;overflow-y:auto;padding:0 16px 96px}
h2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 6px;font:600 1.05rem Georgia,"Times New Roman",serif}
h2.bad{color:var(--bad)}
.it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--ln)}
.it.ok .tx{opacity:.5;text-decoration:line-through}
.tx{flex:1;min-width:0;cursor:pointer}
.tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.tx small{color:var(--mut)}
.ck{flex:none;width:28px;height:28px;padding:0;border:2px solid var(--mut);border-radius:50%;background:none;color:#fff;font-size:16px;cursor:pointer}
.it.ok .ck{background:var(--ok);border-color:var(--ok)}
.x{border:0;background:none;color:var(--mut);font-size:24px;padding:0 6px;cursor:pointer}
.vz{color:var(--mut);margin:8px 4px}
.bt{display:block;width:100%;margin:10px 0;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;text-align:center;cursor:pointer}
.bt.sec{background:none;color:var(--tx);border:1px solid var(--ln)}
.bt.dg{background:var(--bad);color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.add{display:flex;gap:8px;margin-top:12px}
.add button{padding:0 18px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.lk{border:0;background:none;color:var(--ac);font:inherit;font-size:.85rem;cursor:pointer}
.mh{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.mh b{font:600 1.1rem Georgia,serif;text-transform:capitalize}
.mh button{width:46px;height:42px;border:1px solid var(--ln);border-radius:10px;background:none;color:var(--tx);font-size:22px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dw{font-style:normal;font-size:.8rem;color:var(--mut)}
.dd{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;color:var(--tx);font:inherit;cursor:pointer}
.dd.hj{border-color:var(--ac)}
.dd.sl{background:var(--ac);color:var(--bg);font-weight:700}
.dd.pt::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.dd.sl.pt::after{background:var(--bg)}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:13px 0;border:0;background:none;color:var(--mut);font:inherit;font-size:.85rem;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
#fab{position:fixed;right:max(18px,calc(50vw - 302px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:50%;background:var(--ac);color:var(--bg);font-size:30px;box-shadow:0 4px 14px #0004;cursor:pointer}
#fab[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:#0008}
.sh{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:var(--bg)}
.sh h3{margin:0;font:600 1.2rem Georgia,serif}
.r{display:flex;gap:8px}
.r .bt{margin:0}
.auth-box{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="tit">Agenda</h1>
  <div class="user-bar" id="userBar"></div>
</header>
<main id="app"></main>
<button id="fab" data-a="fab" aria-label="Novo evento">+</button>
<nav>
  <button data-a="tab" data-t="resumo">Resumo</button>
  <button data-a="tab" data-t="agenda">Agenda</button>
  <button data-a="tab" data-t="rapidos">Rápidos</button>
  <button data-a="tab" data-t="mais">Dados</button>
</nav>

<script type="module">
// ---------- Firebase SDK Moderno (v10) ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, writeBatch 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { 
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// !!! COLE SUAS CREDENCIAIS DO FIREBASE AQUI !!!
const firebaseConfig = {

  apiKey: "AIzaSyBVCf0QKwcZYdgVVZX7CduaPLg967NyEFU",

  authDomain: "agendadoze-2b5b9.firebaseapp.com",

  projectId: "agendadoze-2b5b9",

  storageBucket: "agendadoze-2b5b9.firebasestorage.app",

  messagingSenderId: "141904881854",

  appId: "1:141904881854:web:7946fed66a45d6082116ef"

};


// Inicializa o Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

let currentUser = null;
let D = { versao: 1, eventos: [], rapidos: [], config: { tema: 'auto' } };

// ---------- Utilitários ----------
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeISO = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = s => parse(s).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ord = (a, b) => (a.data + (a.hora || '99')) < (b.data + (b.hora || '99')) ? -1 : 1;

let aba = 'resumo', sel = hojeISO(), mes = new Date();
mes.setDate(1);

// ---------- Sincronização em Tempo Real (Firestore) ----------
function escutarDadosUsuario(uid) {
  // Escuta a coleção de eventos do usuário
  onSnapshot(collection(db, "users", uid, "eventos"), (snapshot) => {
    D.eventos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });

  // Escuta a coleção de lembretes rápidos
  onSnapshot(collection(db, "users", uid, "rapidos"), (snapshot) => {
    D.rapidos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });
}

// ---------- Autenticação ----------
onAuthStateChanged(auth, user => {
  currentUser = user;
  const userBar = $('#userBar');
  if (user) {
    userBar.innerHTML = `<button class="lk" id="btnLogout">Sair</button>`;
    $('#btnLogout').onclick = () => signOut(auth);
    escutarDadosUsuario(user.uid);
  } else {
    userBar.innerHTML = '';
    D.eventos = [];
    D.rapidos = [];
    render();
  }
});

// ---------- Componentes HTML ----------
const evItem = (e, sd) => `<div class="it ${e.feito ? 'ok' : ''}">
  <button class="ck" data-a="ev-ck" data-id="${e.id}" aria-label="Concluir">${e.feito ? '✓' : ''}</button>
  <div class="tx" data-a="ev-ed" data-id="${e.id}"><b>${esc(e.titulo)}</b>
  <small>${sd ? fmt(e.data) + ' ' : ''}${e.hora || ''}${e.nota ? ' – ' + esc(e.nota) : ''}</small></div></div>`;

const rpItem = r => `<div class="it ${r.feito ? 'ok' : ''}">
  <button class="ck" data-a="rp-ck" data-id="${r.id}" aria-label="Concluir">${r.feito ? '✓' : ''}</button>
  <div class="tx"><b>${esc(r.texto)}</b></div>
  <button class="x" data-a="rp-del" data-id="${r.id}" aria-label="Apagar">×</button></div>`;

const sec = (t, l, h, c) => l.length ? `<h2 class="${c || ''}">${t}</h2>${h}` : '';

// ---------- Telas ----------
function vLogin() {
  return `<div class="auth-box">
    <h2>Bem-vindo à sua Agenda</h2>
    <p class="vz">Faça login para sincronizar seus compromissos entre o celular e o computador em tempo real.</p>
    <button class="bt" id="btnLogin">Entrar com Google</button>
  </div>`;
}

function vResumo() {
  const h = hojeISO(), lim = iso(new Date(Date.now() + 14 * 864e5));
  const todos = D.eventos.slice().sort(ord);
  const at = todos.filter(e => !e.feito && e.data < h);
  const hj = todos.filter(e => e.data === h);
  const pr = todos.filter(e => !e.feito && e.data > h && e.data <= lim);
  const rp = D.rapidos.filter(r => !r.feito);
  const html =
    sec('Atrasados', at, at.map(e => evItem(e, 1)).join(''), 'bad') +
    sec('Hoje', hj, hj.map(e => evItem(e)).join('')) +
    sec('Próximos 14 dias', pr, pr.map(e => evItem(e, 1)).join('')) +
    sec('Para lembrar', rp, rp.map(rpItem).join(''));
  return html || '<p class="vz">Nada pendente. Toque em + para criar um evento ou use a aba Rápidos.</p>';
}

function vAgenda() {
  const y = mes.getFullYear(), m = mes.getMonth(), h = hojeISO();
  const ini = new Date(y, m, 1).getDay(), dias = new Date(y, m + 1, 0).getDate();
  const tem = {};
  D.eventos.forEach(e => { if (!e.feito) tem[e.data] = 1; });
  let c = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<i class="dw">${x}</i>`).join('');
  for (let i = 0; i < ini; i++) c += '<i></i>';
  for (let d = 1; d <= dias; d++) {
    const s = y + '-' + pad(m + 1) + '-' + pad(d);
    c += `<button class="dd ${s === h ? 'hj' : ''} ${s === sel ? 'sl' : ''} ${tem[s] ? 'pt' : ''}" data-a="dia" data-d="${s}">${d}</button>`;
  }
  const l = D.eventos.filter(e => e.data === sel).sort(ord);
  return `<div class="mh"><button data-a="mes" data-n="-1" aria-label="Mês anterior">‹</button>
    <b>${mes.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</b>
    <button data-a="mes" data-n="1" aria-label="Próximo mês">›</button></div>
    <div class="cal">${c}</div>
    <h2>${fmt(sel)}</h2>
    ${l.map(e => evItem(e)).join('') || '<p class="vz">Nada neste dia.</p>'}
    <button class="bt sec" data-a="novo" data-d="${sel}">Adicionar evento neste dia</button>`;
}

function vRapidos() {
  const p = D.rapidos.filter(r => !r.feito), f = D.rapidos.filter(r => r.feito);
  return `<form class="add" data-a="rp-add"><input id="rpt" placeholder="O que lembrar depois?" autocomplete="off" required><button>Adicionar</button></form>`
    + (p.map(rpItem).join('') || '<p class="vz">Sem pendências.</p>')
    + (f.length ? `<h2>Concluídos <button class="lk" data-a="rp-lim">Limpar</button></h2>` + f.map(rpItem).join('') : '');
}

function vMais() {
  return `<h2>Nuvem & Sincronização</h2>
    <p class="vz">Conectado como <b>${esc(currentUser ? currentUser.email : 'Visitante')}</b>. Seus dados são salvos no Firebase em tempo real.</p>
    <h2>Tema</h2>
    <select id="tema"><option value="auto">Automático</option><option value="claro">Claro</option><option value="escuro">Escuro</option></select>
    <h2>Resumo dos dados</h2>
    <p class="vz">${D.eventos.length} eventos, ${D.rapidos.length} lembretes salvos na nuvem.</p>`;
}

const TITULOS = { resumo: 'Resumo', agenda: 'Agenda', rapidos: 'Lembretes rápidos', mais: 'Dados e ajustes' };

function render() {
  const app = $('#app');
  if (!currentUser) {
    app.innerHTML = vLogin();
    $('#fab').hidden = true;
    $('nav').style.display = 'none';
    $('#btnLogin').onclick = () => signInWithPopup(auth, googleProvider).catch(e => alert(e.message));
    return;
  }
  $('nav').style.display = 'flex';
  document.documentElement.dataset.tema = D.config.tema === 'auto' ? '' : D.config.tema;
  const y = app.scrollTop;
  app.innerHTML = { resumo: vResumo, agenda: vAgenda, rapidos: vRapidos, mais: vMais }[aba]();
  app.scrollTop = y;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === aba));
  $('#fab').hidden = !(aba === 'resumo' || aba === 'agenda');
  $('#tit').textContent = TITULOS[aba];
  const t = $('#tema'); if (t) t.value = D.config.tema;
}

// ---------- Operações no Firestore ----------
async function salvarEvento(id, o) {
  if (!currentUser) return;
  const colRef = collection(db, "users", currentUser.uid, "eventos");
  if (id) {
    await updateDoc(doc(db, "users", currentUser.uid, "eventos", id), o);
  } else {
    await addDoc(colRef, { feito: false, ...o });
  }
}

async function alternarEvento(id) {
  if (!currentUser) return;
  const e = D.eventos.find(x => x.id === id);
  if (e) {
    await updateDoc(doc(db, "users", currentUser.uid, "eventos", id), { feito: !e.feito });
  }
}

async function deletarEvento(id) {
  if (!currentUser) return;
  await deleteDoc(doc(db, "users", currentUser.uid, "eventos", id));
}

async function adicionarRapido(texto) {
  if (!currentUser) return;
  await addDoc(collection(db, "users", currentUser.uid, "rapidos"), { texto, feito: false, criadoEm: Date.now() });
}

async function alternarRapido(id) {
  if (!currentUser) return;
  const r = D.rapidos.find(x => x.id === id);
  if (r) {
    await updateDoc(doc(db, "users", currentUser.uid, "rapidos", id), { feito: !r.feito });
  }
}

async function deletarRapido(id) {
  if (!currentUser) return;
  await deleteDoc(doc(db, "users", currentUser.uid, "rapidos", id));
}

// ---------- Modal de Evento ----------
function abrirEv(id, data) {
  const ex = D.eventos.find(x => x.id === id);
  const e = ex || { titulo: '', data: data || hojeISO(), hora: '', nota: '' };
  const m = document.createElement('div');
  m.className = 'ov';
  m.innerHTML = `<form class="sh"><h3>${ex ? 'Editar evento' : 'Novo evento'}</h3>
    <input name="t" placeholder="Título" required value="${esc(e.titulo)}">
    <div class="r"><input type="date" name="d" required value="${e.data}"><input type="time" name="h" value="${e.hora || ''}"></div>
    <textarea name="n" rows="2" placeholder="Nota (opcional)">${esc(e.nota || '')}</textarea>
    <div class="r"><button class="bt">Salvar</button>
    ${ex ? '<button type="button" class="bt dg" data-x="del">Excluir</button>' : ''}
    <button type="button" class="bt sec" data-x="can">Cancelar</button></div></form>`;
  document.body.appendChild(m);

  m.onclick = ev => {
    const x = ev.target.dataset.x;
    if (ev.target === m || x === 'can') m.remove();
    if (x === 'del' && confirm('Excluir este evento?')) {
      deletarEvento(id);
      m.remove();
    }
  };

  m.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const o = { titulo: f.get('t').trim(), data: f.get('d'), hora: f.get('h'), nota: f.get('n').trim() };
    await salvarEvento(id, o);
    sel = o.data; mes = parse(o.data); mes.setDate(1);
    m.remove();
  };
  if (!ex) m.querySelector('input').focus();
}

// ---------- Eventos da UI ----------
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'tab') { aba = b.dataset.t; render(); $('#app').scrollTop = 0; }
  else if (a === 'fab') abrirEv(null, aba === 'agenda' ? sel : hojeISO());
  else if (a === 'novo') abrirEv(null, b.dataset.d);
  else if (a === 'ev-ed') abrirEv(id);
  else if (a === 'ev-ck') alternarEvento(id);
  else if (a === 'rp-ck') alternarRapido(id);
  else if (a === 'rp-del') deletarRapido(id);
  else if (a === 'rp-lim') {
    D.rapidos.filter(x => x.feito).forEach(x => deletarRapido(x.id));
  }
  else if (a === 'dia') { sel = b.dataset.d; render(); }
  else if (a === 'mes') { mes.setMonth(mes.getMonth() + Number(b.dataset.n)); render(); }
});

document.addEventListener('submit', ev => {
  if (ev.target.dataset.a !== 'rp-add') return;
  ev.preventDefault();
  const t = $('#rpt').value.trim();
  if (t) { adicionarRapido(t); $('#rpt').value = ''; }
});

document.addEventListener('change', ev => {
  if (ev.target.id === 'tema') { D.config.tema = ev.target.value; render(); }
});

render();
</script>
</body>
</html>
